name: Deploy RemPush PWA

on:
  push:
    branches:
      - main
    paths:
      - 'PWA-RemPush/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate PWA files
        run: |
          test -f PWA-RemPush/index.html
          test -f PWA-RemPush/app.js
          test -f PWA-RemPush/sw.js
          test -f PWA-RemPush/manifest.webmanifest
          test -f PWA-RemPush/app-icon.svg
          node --check PWA-RemPush/app.js
          node --check PWA-RemPush/sw.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: './PWA-RemPush'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
