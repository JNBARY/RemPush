<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RemPush">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="app-icon.png">
  <title>RemPush</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; font-family: Helvetica, Arial, sans-serif; }
    body { overflow: hidden; color: #111; background: #ff0000; transition: background-color .25s ease; }
    button, input, textarea { font: inherit; font-size: 16px; }
    button { border: 0; background: none; cursor: pointer; }
    .app { width: 100%; height: 100svh; min-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
    .toolbar { flex: 0 0 calc(54px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 10px 0; display: flex; align-items: end; justify-content: space-between; background: rgba(255,255,255,.12); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); position: relative; z-index: 5; }
    .toolbar-group { display: flex; gap: 4px; }
    .tool { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; font-size: 21px; color: inherit; }
    .tool:active { background: rgba(255,255,255,.3); }
    .viewport { flex: 1 1 auto; min-height: 0; overflow: hidden; position: relative; }
    .pages { position: absolute; inset: 0; display: flex; will-change: transform; transform: translate3d(-100%,0,0); }
    .page { flex: 0 0 100%; min-width: 100%; height: 100%; display: flex; flex-direction: column; gap: 18px; padding: 18px 12px calc(14px + env(safe-area-inset-bottom)); overflow: auto; overscroll-behavior: contain; }
    .title { width: 100%; border: 0; outline: 0; background: transparent; font-size: 28px; font-weight: 600; border-radius: 10px; }
    .body { width: 100%; flex: 1 1 auto; min-height: 220px; resize: none; border: 0; outline: 0; padding: 12px; border-radius: 18px; background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
    .footer { display: flex; align-items: center; gap: 8px; min-height: 28px; font-size: 13px; }
    .badge { padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.35); font-weight: 600; }
    .muted { color: rgba(0,0,0,.55); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 20; display: none; align-items: flex-end; }
    .modal-backdrop.open { display: flex; }
    .modal { width: 100%; max-height: 85svh; overflow: auto; background: rgba(250,250,250,.94); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-radius: 22px 22px 0 0; padding: 18px; color: #111; }
    .modal h2 { margin: 0 0 16px; font-size: 20px; }
    .modal p { line-height: 1.45; color: #444; }
    .modal button.action { width: 100%; padding: 13px 14px; margin: 6px 0; border-radius: 12px; background: #e8e8e8; text-align: left; }
    .modal button.primary { background: #111; color: white; }
    .modal input { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 10px; margin: 5px 0 10px; }
    .toast { position: fixed; top: calc(66px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; background: rgba(30,30,30,.78); color: white; z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="toolbar-group"><button class="tool" id="settings" aria-label="Settings">&#9881;</button></div>
      <div class="toolbar-group">
        <button class="tool" id="notify" aria-label="Send notification">&#128276;</button>
        <button class="tool" id="share" aria-label="Share">&#8593;</button>
        <button class="tool" id="delete" aria-label="Delete page">&#128465;</button>
      </div>
    </header>
    <main class="viewport" id="viewport"><div id="pages" class="pages"></div></main>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modalBackdrop" class="modal-backdrop"><section id="modal" class="modal"></section></div>
  <script type="module" src="app.js"></script>
</body>
</html>
