<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="iconMask">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>

    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#3E91FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0088FF" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="grad-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#70D272" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34C759" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#63CDDB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00C3D0" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="grad-gold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#FFC429" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFCC00" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="grad-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FF544E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF383C" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#D047F1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CB30E0" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="grad-mint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#439A5E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#009051" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFA642" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF9300" stop-opacity="1"/>
    </linearGradient>

    <filter id="tileShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g clip-path="url(#iconMask)">
    <!-- background plate -->
    <rect x="0" y="0" width="1024" height="1024" fill="#F6F6F8"/>

    <!-- colorful rounded-square tiles, arranged as in icon.json (back to front) -->
    <g stroke="#000000" stroke-opacity="0.12" stroke-width="2.5">
      <g filter="url(#tileShadow)">
        <rect x="565.30" y="551.66" width="250" height="250" rx="25" ry="25" fill="url(#grad-blue)"/>
        <rect x="402.97" y="630.22" width="250" height="250" rx="25" ry="25" fill="url(#grad-green)"/>
        <rect x="248.46" y="551.66" width="250" height="250" rx="25" ry="25" fill="url(#grad-teal)"/>
        <rect x="560.27" y="228.95" width="250" height="250" rx="25" ry="25" fill="url(#grad-gold)"/>
        <rect x="402.97" y="130.95" width="250" height="250" rx="25" ry="25" fill="url(#grad-red)"/>
        <rect x="280.47" y="184.16" width="250" height="250" rx="25" ry="25" fill="url(#grad-purple)"/>
        <rect x="125.96" y="278.40" width="250" height="250" rx="25" ry="25" fill="url(#grad-mint)"/>
        <rect x="85.69"  y="432.72" width="250" height="250" rx="25" ry="25" fill="url(#grad-orange)"/>
        <rect x="647.97" y="375.95" width="250" height="250" rx="25" ry="25" fill="url(#grad-purple)"/>
      </g>
    </g>

    <!-- angled arrow overlay, drawn on top with a darken blend to match icon.json -->
    <g transform="translate(97.06,119.30) scale(3.8)" opacity="0.8" style="mix-blend-mode:darken">
      <g stroke-linecap="round" stroke="#000000" stroke-width="4" fill="none">
        <path d="M116.728 91.052c-13.39 9.67-68.15 39.4-84.11 59.51-15.95 20.11-35.18 51.2-11.6 61.15 23.57 9.96 120.69 8.52 153.04-1.44s34.2-24.95 41.07-58.33-.07-118.24.16-141.94m-101.22 78.37c-12.35 9.98-60.89 44.37-76.49 65.34s-39.85 50.72-17.11 60.48c22.73 9.75 121.66 8.23 153.51-1.95s30.15-26.3 37.59-59.11 5.86-114.59 7.05-137.73"/>
        <path d="M226.438 37.152c-2.2-1.54-4.16-9.21-8.66-21.87m9.38 23.16c-2.03-6.22-5.87-15.06-9.1-23.48"/>
        <path d="M209.348 36.822c1.51-1.55 3.26-9.15 8.43-21.54m-7.72 22.84c3.4-6.03 5-14.78 8-23.16"/>
      </g>
    </g>
  </g>
</svg>
